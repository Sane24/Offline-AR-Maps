# XcodeGen project spec for TrailSight iOS.
# Generate the Xcode project with:
#   brew install xcodegen
#   cd ios && xcodegen generate
name: TrailSight

options:
  bundleIdPrefix: com.trailsight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  TrailSight:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TrailSight
      - path: Resources/Assets.xcassets
      - path: Resources/catalog.json
        buildPhase: resources
      # Folder reference: the DemoRegion directory is copied into the app
      # bundle as-is, preserving the routes/ subdirectory, so the region
      # pack layout matches the web manifest exactly.
      - path: Resources/DemoRegion
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trailsight.app
        PRODUCT_NAME: TrailSight
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: TrailSight/Info.plist
      properties:
        CFBundleDisplayName: TrailSight
        UILaunchScreen: {}
        NSCameraUsageDescription: TrailSight shows trail guidance in augmented reality by drawing the route over the live camera view.
        NSLocationWhenInUseUsageDescription: Your position anchors the trail, waypoints, and guidance in the AR view and drives offline navigation.
        NSMotionUsageDescription: Device motion keeps the AR horizon and heading alignment stable while you walk.
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities:
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

schemes:
  TrailSight:
    build:
      targets:
        TrailSight: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
